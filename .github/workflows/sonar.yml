name: Sonar
on:
  push:
    branches:
      - master
      - develop
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Update ubuntu
        run: sudo apt update -y
      - name: Install missing libraries
        run: sudo apt-get install xvfb libopencv-dev tesseract-ocr libxtst6 libxi6 libnotify4 libsdl1.2debian libsdl2.2 wxpython-tools -y
      - name: Install JDK
        run: |
             sudo apt install -y ca-certificates curl gnupg
             sudo mkdir -p /etc/apt/keyrings
             curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public | sudo gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
             echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(awk -F= '/^VERSION_CODENAME/{print$2}' /etc/os-release) main" | sudo tee /etc/apt/sources.list.d/adoptium.list
             sudo apt update && sudo apt install -y temurin-24-jdk
             sudo echo export JAVA_HOME=/usr/lib/jvm/temurin-24-jdk-amd64 > $HOME/jdk24.sh
             sudo echo export PATH=\$JAVA_HOME/bin:\$PATH >> $HOME/jdk24.sh
             sudo chmod a+x $HOME/jdk24.sh
             sudo /bin/bash $HOME/jdk24.sh
      - name: Install xorg
        run: sudo apt-get install -y xorg openbox
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}
      - name: Install invoke and any other packages
        run: sudo pip install coverage invoke pytest
      - name: Install SikuliLibrary dependencies
        run: |
             sudo pip install robotframework
      - name: Run Xvfb
        run: |
             Xvfb :99 -screen 0 1920x1080x24 -noreset &
             sleep 2  # give Xvfb time to initialize
             echo "DISPLAY=:99" >> $GITHUB_ENV
      - name: Test Install SikuliLibrary
        env:
          DISPLAY: :99
        timeout-minutes: 20 
        run: |
             sudo /bin/bash $HOME/jdk24.sh
             echo DEBUG: JAVA_HOME=$JAVA_HOME
             sudo pip install robotframework
             sudo ./build.sh
             sudo pip install dist/robotframework_sikulilibrary-*.whl 
      - name: Analyze with SonarCloud
        uses: sonarsource/sonarqube-scan-action@v8.0.0
        with:
          projectBaseDir: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DISPLAY: :1

